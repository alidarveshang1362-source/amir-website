<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سایت من</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        header {
            background: #222;
            color: white;
            padding: 40px 20px;
        }

        h1 {
            font-size: 40px;
        }

        .card {
            background: white;
            width: 80%;
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 15px #aaa;
        }

        button {
            background: #222;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #444;
        }
    </style>
</head>

<body>

    <header>
        <h1>سلام! 👋</h1>
        <p>به سایت من خوش آمدی</p>
    </header>

    <div class="card">
        <h2>درباره من</h2>
        <p>اینجا می‌توانم خودم و کارهایم را معرفی کنم.</p>

        <button onclick="alert('خوش آمدی! 😎')">
            کلیک کن
        </button>
    </div>

</body>
</html>
