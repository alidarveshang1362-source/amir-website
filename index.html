<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>امیر حسین درویشان 🎮</title>

    <style>
        * {
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f1f3f6;
            color: #222;
        }

        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #111;
            padding: 16px;
            text-align: center;
        }

        nav a {
            display: inline-block;
            color: white;
            text-decoration: none;
            margin: 5px 10px;
            padding: 10px 16px;
            border-radius: 12px;
            transition: .3s;
        }

        nav a:hover {
            background: white;
            color: #111;
            transform: translateY(-5px) scale(1.05);
        }

        header {
            min-height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #222, #555);
            color: white;
        }

        header h1 {
            font-size: 55px;
            margin-bottom: 10px;
            animation: appear 1.2s ease;
        }

        header p {
            font-size: 22px;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .game-button {
            background: white;
            color: #222;
            padding: 15px 25px;
            border-radius: 15px;
            font-size: 17px;
            text-decoration: none;
            transition: .3s;
        }

        .game-button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 8px 20px #0006;
        }

        .card {
            background: white;
            width: 85%;
            max-width: 600px;
            margin: 50px auto;
            padding: 35px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 8px 25px #bbb;
        }

        footer {
            text-align: center;
            background: #111;
            color: white;
            padding: 25px;
            margin-top: 60px;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(-40px) scale(.8);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media(max-width:600px) {
            header h1 {
                font-size: 38px;
            }

            header p {
                font-size: 18px;
            }

            .game-button {
                font-size: 15px;
                padding: 13px 18px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="#home">🏠 خانه</a>
        <a href="#about">👤 درباره من</a>
        <a href="#games">🎮 بازی‌ها</a>
        <a href="#contact">📞 تماس</a>
    </nav>

    <header id="home">

        <h1>امیر حسین درویشان</h1>

        <p>به سایت من خوش آمدی 😎</p>

        <div class="buttons">

            <a href="https://alidarveshang1362-source.github.io/index.html/"
               class="game-button">
                🎯 بازی حدس کلمه
            </a>

            <a href="https://alidarveshang1362-source.github.io/index.htm/"
               class="game-button">
                ⭕ بازی دوز
            </a>

            <a href="tetris.html"
               class="game-button">
                🎮 تتریس
            </a>

        </div>

    </header>

    <section class="card" id="about">

        <h2>👤 درباره من</h2>

        <p>
            سلام! من امیر حسین درویشان هستم.<br>
            این سایت منه و دارم برنامه‌نویسی یاد می‌گیرم. 🚀
        </p>

    </section>

    <section class="card" id="contact">

        <h2>📞 تماس با من</h2>

        <p>
            این قسمت را می‌توانیم بعداً کامل‌تر کنیم.
        </p>

    </section>

    <footer>
        (ع.م.ج.خ.خ.م.ر.ا)
    </footer>

</body>
</html>
